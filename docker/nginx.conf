# Serve o dist/ do C4 Board. A navegacao do app e por hash (#conteineres),
# entao nao ha rotas no servidor: so arquivos.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Arquivos com hash no nome (gerados pelo Vite): cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # index.html sempre revalidado, para uma imagem nova valer na hora.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
